<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent board</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Dark by default, whatever the OS setting; the header toggle switches and is remembered. */
  :root {
    color-scheme: dark;
    --bg: #111418; --panel: #181c21; --line: #2a3038; --fg: #d8dde3; --dim: #8b949e;
    --ok: #3fb950; --bad: #f85149; --run: #4ea1ff; --sel: #1d2733; --warn: #d29922;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde3; --fg: #1d2229; --dim: #6a7380;
    --ok: #1a7f37; --bad: #cf222e; --run: #0969da; --sel: #e8f0fb; --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 4px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 16px 0 0; }
  header button { background: none; border: 0; color: var(--dim); font: inherit; padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
  header button.on { color: var(--fg); border-color: var(--run); }
  #conn { margin-left: auto; font-size: 12px; color: var(--dim); margin-right: 10px; }
  header button#theme { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #agents { width: 340px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 8px; }
  #detail, #tests { flex: 1; overflow: auto; padding: 16px 20px; }
  .agent { padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
  .agent:hover { background: var(--sel); }
  .agent.sel { background: var(--sel); border-color: var(--line); }
  .agent .t { font-weight: 600; }
  .agent .m { color: var(--dim); font-size: 12px; }
  .agent .a { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.working { background: var(--run); animation: pulse 1.2s infinite; }
  .dot.review { background: var(--warn); } .dot.done { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .25; } }
  details.arch > summary { cursor: pointer; color: var(--dim); padding: 6px 4px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
  .meta { color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .meta a { color: var(--run); }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; }
  .test { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
  .test .r { width: 3.4em; font-weight: 700; flex: none; }
  .test .s { margin-left: auto; width: 4em; flex: none; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .test .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail, #tests { min-width: 0; overflow-x: hidden; }
  .meta span { overflow-wrap: anywhere; }
  summary { overflow-wrap: anywhere; }
  @media (max-width: 900px) {
    #m-agents { flex-direction: column; }
    #agents { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #detail, #tests { padding: 12px; }
  }
  .PASS { color: var(--ok); } .FAIL { color: var(--bad); } .RUN { color: var(--run); }
  .msg { color: var(--bad); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 0 0 4px 3.9em; }
  .ev { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .ev time { color: var(--dim); font-size: 12px; flex: none; width: 5.5em; font-variant-numeric: tabular-nums; }
  .ev .k { color: var(--dim); font-size: 12px; flex: none; width: 4.5em; }
  details.run { margin: 4px 0; }
  details.run > summary { cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 3px 6px; border-radius: 4px; }
  .empty { color: var(--dim); padding: 20px 0; }
  .hidden { display: none; }
  .browser { position: relative; display: block; max-width: 640px; }
  .browser img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: var(--panel); }
  .badge { font-size: 12px; margin: 0 0 4px; color: var(--dim); }
  .badge.live { color: var(--ok); }
  .thumb { height: 22px; border: 1px solid var(--line); border-radius: 3px; cursor: zoom-in; flex: none; align-self: center; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  #lightbox img { max-width: 96vw; max-height: 96vh; }
</style>
</head>
<body>
<header>
  <h1>Agent board</h1>
  <button id="tab-agents" class="on">Agents</button>
  <button id="tab-tests">Tests</button>
  <span id="conn">connecting...</span>
  <button id="theme" title="Switch light / dark"></button>
</header>
<main id="m-agents">
  <div id="agents"></div>
  <div id="detail"><div class="empty">Select an agent.</div></div>
</main>
<main id="m-tests" class="hidden"><div id="tests"></div></main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const time = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateTime = (ts) => new Date(ts * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const get = async (p) => (await fetch(p)).json();
  const setTheme = (t, save) => {
    document.documentElement.dataset.theme = t;
    $('theme').textContent = t === 'dark' ? 'Light' : 'Dark';
    if (save) { try { localStorage.setItem('agent-board-theme', t); } catch (e) { /* private mode: not remembered */ } }
  };
  let stored = null;
  try { stored = localStorage.getItem('agent-board-theme'); } catch (e) { /* ignore */ }
  setTheme(stored === 'light' ? 'light' : 'dark', false);
  $('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
  const state = { agents: [], sel: null, tab: 'agents', suite: '', open: new Set(), detail: null };

  const render = () => { renderAgents(); renderDetail(); if (state.tab === 'tests') renderTests(); };

  function agentRow(a) {
    const act = a.lastAction ? a.lastAction.text : (a.lastRun ? `${a.lastRun.suite}: ${a.lastRun.summary || 'running'}` : '');
    return `<div class="agent ${a.id === state.sel ? 'sel' : ''}" data-id="${esc(a.id)}">
      <div class="t"><span class="dot ${esc(a.status)}"></span>${esc(a.title || a.id)}</div>
      <div class="m">${esc(a.name || '')} &middot; ${esc(a.status)}</div>
      <div class="a">${esc(act)}</div></div>`;
  }
  function renderAgents() {
    const live = state.agents.filter((a) => a.status !== 'archived');
    const arch = state.agents.filter((a) => a.status === 'archived');
    const wasOpen = document.querySelector('details.arch')?.open;
    $('agents').innerHTML = (live.map(agentRow).join('') || '<div class="empty">No active agent.</div>') +
      (arch.length ? `<details class="arch" ${wasOpen ? 'open' : ''}><summary>Archived (${arch.length})</summary>${arch.map(agentRow).join('')}</details>` : '');
  }

  function runTests(r) {
    return r.tests.map((t) => {
      const res = t.ok === null ? 'RUN' : t.ok ? 'PASS' : 'FAIL';
      const thumb = t.shot ? `<img class="thumb" data-full="/api/shots/${esc(t.shot)}.jpg" src="/api/shots/${esc(t.shot)}.jpg" loading="lazy" alt="screenshot">` : '';
      return `<div class="test"><span class="r ${res}">${res}</span><span class="n" title="${esc(t.name)}">${esc(t.name)}</span>${thumb}<span class="s">${t.seconds != null ? t.seconds + 's' : ''}</span></div>` +
        (t.message ? `<div class="msg">${esc(t.message)}</div>` : '');
    }).join('') || '<div class="empty">No test yet.</div>';
  }
  function runBlock(r, openByDefault) {
    const tests = runTests(r);
    const sum = r.end ? esc(r.summary || `${r.passed} passed, ${r.failed} failed`) : `running (${r.tests.filter((t) => t.ok !== null).length}/${r.total ?? '?'})`;
    const cls = !r.end ? 'RUN' : r.failed ? 'FAIL' : 'PASS';
    const key = 'run:' + r.run;
    const open = state.open.has(key) || (openByDefault && !state.open.has('-' + key));
    return `<details class="run box" data-key="${esc(key)}" ${open ? 'open' : ''}><summary><b class="${cls}">${esc(r.suite)}</b> <span class="m">${dateTime(r.ts)} &middot; ${esc(r.source || '')} &middot; ${sum}</span></summary>${tests}</details>`;
  }

  async function loadDetail() {
    if (!state.sel) return;
    const id = state.sel;
    const d = await get(`/api/agents/${encodeURIComponent(id)}/events`);
    if (id === state.sel) { state.detail = d; renderDetail(); probeFrame(id); }
  }
  function renderDetail() {
    const a = state.agents.find((x) => x.id === state.sel);
    if (!a || !state.detail) return;
    const { events, runs } = state.detail;
    const cur = runs.length ? runs[runs.length - 1] : null;
    const items = events.filter((e) => e.kind === 'action' || e.kind === 'status').map((e) => ({ ts: e.ts, html:
      `<div class="ev"><time>${time(e.ts)}</time><span class="k">${e.kind}</span><span>${esc(e.text)}</span></div>` }));
    runs.forEach((r) => items.push({ ts: r.ts, html: runBlock(r, false) }));
    items.sort((x, y) => y.ts - x.ts);
    const pr = a.pr ? `<a href="${esc(a.pr)}" target="_blank" rel="noopener">PR</a>` : '';
    $('detail').innerHTML = `<h2><span class="dot ${esc(a.status)}"></span>${esc(a.title || a.id)}</h2>
      <div class="meta"><span>${esc(a.name || '')}</span><span class="pill">${esc(a.status)}</span>
      ${a.branch ? `<span>branch ${esc(a.branch)}</span>` : ''}${pr}${a.port ? `<span>port ${a.port}</span>` : ''}${a.checkout ? `<span>${esc(a.checkout)}</span>` : ''}</div>
      <div id="browser">${browserHtml(a.id)}</div>
      <h3>${cur && !cur.end ? 'Test run in progress' : 'Latest test run'}</h3>
      ${cur ? runBlock(cur, true) : '<div class="empty">No test run yet.</div>'}
      <h3>Timeline</h3>${items.map((i) => i.html).join('') || '<div class="empty">Nothing yet.</div>'}`;
  }

  // Browser panel: the latest live frame of the agent (never stored server side), reloaded on each 'frame' message.
  const frames = {};  // agent id -> { ts: ms of the last frame message (or from the first load), v: cache-buster }
  const browserHtml = (id) => {
    const f = frames[id];
    if (!f) return '';
    const live = Date.now() - f.ts < 3000;
    return `<h3>Browser</h3><div class="badge ${live ? 'live' : ''}">${live ? '&#9679; live' : 'last frame ' + time(f.ts / 1000)}</div>
      <div class="browser"><img id="frame" data-full="1" src="/api/agents/${encodeURIComponent(id)}/frame?v=${f.v}" alt="agent browser"></div>`;
  };
  const refreshBrowser = () => { const el = $('browser'); if (el && state.sel) el.innerHTML = browserHtml(state.sel); };
  async function onFrame(id, ts) {
    const f = frames[id] || (frames[id] = { ts: 0, v: 0 });
    f.ts = ts * 1000; f.v = ts;
    if (id === state.sel) refreshBrowser();
    clearTimeout(onFrame.t); onFrame.t = setTimeout(refreshBrowser, 3200);  // flips the badge to "last frame" once frames stop
  }
  async function probeFrame(id) {
    if (frames[id]) return;
    try { const r = await fetch(`/api/agents/${encodeURIComponent(id)}/frame`, { cache: 'no-store' }); if (r.ok) { frames[id] = { ts: Date.now() - 60000, v: Date.now() }; refreshBrowser(); } } catch (e) { /* none */ }
  }
  const lightbox = (src) => {
    const d = document.createElement('div'); d.id = 'lightbox'; d.innerHTML = `<img src="${src}">`;
    d.onclick = () => d.remove(); document.body.appendChild(d);
  };
  document.addEventListener('click', (e) => {
    const im = e.target.closest('img.thumb, #frame');
    if (im) lightbox(im.dataset.full === '1' ? im.src : im.dataset.full);
  });

  async function renderTests() {
    const runs = await get('/api/runs' + (state.suite ? '?suite=' + encodeURIComponent(state.suite) : ''));
    const all = state.suite ? await get('/api/runs') : runs;
    const suites = [...new Set(all.map((r) => r.suite))].sort();
    const label = (id) => { const a = state.agents.find((x) => x.id === id); return a ? (a.title || a.id) : id; };
    $('tests').innerHTML = `<div style="margin-bottom:10px">Suite <select id="suite"><option value="">All</option>${suites.map((s) => `<option ${s === state.suite ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>` +
      (runs.length ? '' : '<div class="empty">No run yet.</div>') +
      runs.map((r) => `<details class="run box" data-key="trun:${esc(r.run)}" ${state.open.has('trun:' + r.run) ? 'open' : ''}><summary>${dateTime(r.ts)} &middot; <b class="${!r.end ? 'RUN' : r.failed ? 'FAIL' : 'PASS'}">${esc(r.suite)}</b> &middot; ${esc(label(r.agent))} &middot; ${esc(r.source || '')} &middot; ${r.end ? esc(r.summary) : 'running'}</summary>${runTests(r)}</details>`).join('');
    $('suite').onchange = (e) => { state.suite = e.target.value; renderTests(); };
  }

  // Remember which <details> the user opened, across live re-renders.
  document.addEventListener('toggle', (e) => {
    const d = e.target, k = d.dataset && d.dataset.key;
    if (!k) return;
    if (d.open) { state.open.add(k); state.open.delete('-' + k); } else { state.open.delete(k); state.open.add('-' + k); }
  }, true);
  $('agents').onclick = (e) => {
    const el = e.target.closest('.agent');
    if (!el) return;
    state.sel = el.dataset.id; state.detail = null; renderAgents(); loadDetail();
  };
  const setTab = (t) => {
    state.tab = t;
    $('tab-agents').classList.toggle('on', t === 'agents'); $('tab-tests').classList.toggle('on', t === 'tests');
    $('m-agents').classList.toggle('hidden', t !== 'agents'); $('m-tests').classList.toggle('hidden', t !== 'tests');
    if (t === 'tests') renderTests();
  };
  $('tab-agents').onclick = () => setTab('agents');
  $('tab-tests').onclick = () => setTab('tests');

  async function refresh() {
    state.agents = (await get('/api/state')).agents;
    if (!state.sel && state.agents.length) { state.sel = (state.agents.find((a) => a.status !== 'archived') || state.agents[0]).id; }
    renderAgents();
    await loadDetail();
    if (state.tab === 'tests') renderTests();
  }
  let timer = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(() => refresh().catch(() => {}), 120); };
  function connect() {
    const es = new EventSource('/api/stream');
    es.onopen = () => { $('conn').textContent = 'live'; later(); };
    es.onmessage = (m) => {
      let d = {}; try { d = JSON.parse(m.data); } catch (e) { /* ignore */ }
      if (d.type === 'frame') onFrame(d.agent, d.ts); else later();
    };
    es.onerror = () => { $('conn').textContent = 'reconnecting...'; es.close(); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>
