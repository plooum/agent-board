<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent board</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Dark by default, whatever the OS setting; the header toggle switches and is remembered. */
  :root {
    color-scheme: dark;
    --bg: #111418; --panel: #181c21; --line: #2a3038; --fg: #d8dde3; --dim: #8b949e;
    --ok: #3fb950; --bad: #f85149; --run: #4ea1ff; --sel: #1d2733; --warn: #d29922;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde3; --fg: #1d2229; --dim: #6a7380;
    --ok: #1a7f37; --bad: #cf222e; --run: #0969da; --sel: #e8f0fb; --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 4px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 16px 0 0; }
  header button { background: none; border: 0; color: var(--dim); font: inherit; padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
  header button.on { color: var(--fg); border-color: var(--run); }
  #project { margin-left: 16px; }
  #conn { margin-left: auto; font-size: 12px; color: var(--dim); margin-right: 10px; }
  header button#theme { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #agents { width: 340px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 8px; }
  #detail, #tests { flex: 1; overflow: auto; padding: 16px 20px; }
  .agent { padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
  .agent:hover { background: var(--sel); }
  .agent.sel { background: var(--sel); border-color: var(--line); }
  .agent .t { font-weight: 600; }
  .agent .m { color: var(--dim); font-size: 12px; }
  .agent .a { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.working { background: var(--run); animation: pulse 1.2s infinite; }
  .dot.review { background: var(--warn); } .dot.done { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .25; } }
  details.arch > summary { cursor: pointer; color: var(--dim); padding: 6px 4px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
  .meta { color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .meta a { color: var(--run); }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; }
  .test { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
  .test .r { width: 3.4em; font-weight: 700; flex: none; }
  .test .s { margin-left: auto; width: 4em; flex: none; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .test .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail, #tests { min-width: 0; overflow-x: hidden; }
  .meta span { overflow-wrap: anywhere; }
  summary { overflow-wrap: anywhere; }
  @media (max-width: 900px) {
    #m-agents { flex-direction: column; }
    #agents { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #detail, #tests { padding: 12px; }
  }
  .PASS { color: var(--ok); } .FAIL { color: var(--bad); } .RUN { color: var(--run); }
  .msg { color: var(--bad); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 0 0 4px 3.9em; }
  .ev { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .ev time { color: var(--dim); font-size: 12px; flex: none; width: 5.5em; font-variant-numeric: tabular-nums; }
  .ev .k { color: var(--dim); font-size: 12px; flex: none; width: 4.5em; }
  details.run { margin: 4px 0; }
  details.run > summary { cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 3px 6px; border-radius: 4px; }
  .empty { color: var(--dim); padding: 20px 0; }
  .hidden { display: none; }
  /* Fixed 16:10 box: it never resizes when the frames' size changes, nor before the first frame. */
  .browser { position: relative; width: min(100%, calc(70vh * 1.6)); aspect-ratio: 16 / 10; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .browser img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
  .badge { font-size: 12px; margin: 0 0 4px; color: var(--dim); }
  .badge.live { color: var(--ok); }
  .thumb { width: 160px; height: auto; border: 1px solid var(--line); border-radius: 3px; cursor: zoom-in; flex: none; align-self: center; }
  #hover { position: fixed; width: 480px; z-index: 8; pointer-events: none; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.5); background: #000; }
  #hover.hidden { display: none; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  #lightbox img { max-width: 96vw; max-height: 96vh; }
</style>
</head>
<body>
<header>
  <h1>Agent board</h1>
  <button id="tab-agents" class="on">Agents</button>
  <button id="tab-tests">Tests</button>
  <select id="project" title="Project"><option value="">All projects</option></select>
  <span id="conn">connecting...</span>
  <button id="theme" title="Switch light / dark"></button>
</header>
<main id="m-agents">
  <div id="agents"><div id="live"></div><div id="noagent" class="empty hidden">No active agent.</div><details class="arch hidden" id="arch"><summary id="archsum">Archived (0)</summary><div id="archlist"></div></details></div>
  <div id="detail"><div class="empty">Select an agent.</div></div>
</main>
<main id="m-tests" class="hidden"><div id="tests"><div style="margin-bottom:10px">Suite <select id="suite"><option value="">All</option></select></div><div id="norun" class="empty hidden">No run yet.</div><div id="runlist"></div></div></main>
<img id="hover" class="hidden" alt="">
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const time = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateTime = (ts) => new Date(ts * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const get = async (p) => (await fetch(p)).json();
  const setTheme = (t, save) => {
    document.documentElement.dataset.theme = t;
    $('theme').textContent = t === 'dark' ? 'Light' : 'Dark';
    if (save) { try { localStorage.setItem('agent-board-theme', t); } catch (e) { /* private mode: not remembered */ } }
  };
  let stored = null;
  try { stored = localStorage.getItem('agent-board-theme'); } catch (e) { /* ignore */ }
  setTheme(stored === 'light' ? 'light' : 'dark', false);
  $('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
  let storedProject = '';
  try { storedProject = localStorage.getItem('agent-board-project') || ''; } catch (e) { /* ignore */ }
  const state = { agents: [], sel: null, tab: 'agents', suite: '', project: storedProject, open: new Set(), detail: null, detailFor: null };

  // The page is updated in place: elements are keyed, created once, and only touched when their data changed
  // (no innerHTML rebuild of a container), so scroll, hover, open <details> and images survive live updates.
  // items: [{ key, sig, create(), update(el) }]; the container must hold only these elements.
  function reconcile(container, items, cache) {
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.key);
      let rec = cache.get(it.key);
      if (!rec) { rec = { el: it.create(), sig: null }; cache.set(it.key, rec); }
      if (rec.sig !== it.sig) { it.update(rec.el); rec.sig = it.sig; }
      if (container.children[i] !== rec.el) container.insertBefore(rec.el, container.children[i] || null);
    });
    for (const [k, rec] of [...cache]) if (!seen.has(k)) { rec.el.remove(); cache.delete(k); }
  }
  const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  const setHtml = (el, html) => { if (el._html !== html) { el.innerHTML = html; el._html = html; } };

  // ---- projects: a project is the main checkout's path, shown by its basename ----
  const projectName = (p) => p.split('/').filter(Boolean).pop() || p;
  function renderProjects() {
    const projects = [...new Set(state.agents.map((a) => a.project).filter(Boolean))].sort();
    if (state.project && !projects.includes(state.project)) projects.push(state.project);
    const sel = $('project');
    const opts = '<option value="">All projects</option>' + projects.map((p) => `<option value="${esc(p)}" title="${esc(p)}">${esc(projectName(p))}</option>`).join('');
    if (sel._html !== opts) { sel.innerHTML = opts; sel._html = opts; }
    sel.value = state.project;
  }
  $('project').onchange = (e) => {
    state.project = e.target.value;
    try { localStorage.setItem('agent-board-project', state.project); } catch (err) { /* private mode: not remembered */ }
    state.suite = ''; renderAgents(); if (state.tab === 'tests') renderTests();
  };
  const inProject = (a) => !state.project || a.project === state.project;

  // ---- agent list ----
  const liveCache = new Map(), archCache = new Map();
  const agentItem = (a) => {
    const act = a.lastAction ? a.lastAction.text : (a.lastRun ? `${a.lastRun.suite}: ${a.lastRun.summary || 'running'}` : '');
    return { key: a.id, sig: JSON.stringify([a.title, a.name, a.status, act, a.id === state.sel, state.project ? '' : a.project]),
      create: () => { const d = mk('div', 'agent'); d.dataset.id = a.id; return d; },
      update: (el) => {
        el.classList.toggle('sel', a.id === state.sel);
        el.innerHTML = `<div class="t"><span class="dot ${esc(a.status)}"></span>${esc(a.title || a.id)}</div>
          <div class="m">${esc(a.name || '')} &middot; ${esc(a.status)}${!state.project && a.project ? ` &middot; <span title="${esc(a.project)}">${esc(projectName(a.project))}</span>` : ''}</div><div class="a">${esc(act)}</div>`;
      } };
  };
  function renderAgents() {
    renderProjects();
    const shown = state.agents.filter(inProject);
    const live = shown.filter((a) => a.status !== 'archived');
    const arch = shown.filter((a) => a.status === 'archived');
    reconcile($('live'), live.map(agentItem), liveCache);
    reconcile($('archlist'), arch.map(agentItem), archCache);
    $('noagent').classList.toggle('hidden', live.length > 0);
    $('arch').classList.toggle('hidden', arch.length === 0);
    $('archsum').textContent = `Archived (${arch.length})`;
  }

  // ---- test runs (used by the detail and by the Tests tab) ----
  const testItem = (t) => ({ key: t.name, sig: JSON.stringify(t),
    create: () => mk('div'),
    update: (el) => {
      const res = t.ok === null ? 'RUN' : t.ok ? 'PASS' : 'FAIL';
      const url = t.shot ? `/api/shots/${esc(t.shot)}.jpg` : '';
      setHtml(el, `<div class="test"><span class="r ${res}">${res}</span><span class="n" title="${esc(t.name)}">${esc(t.name)}</span>${t.shot ? `<img class="thumb" data-full="${url}" src="${url}" loading="lazy" alt="screenshot">` : ''}<span class="s">${t.seconds != null ? t.seconds + 's' : ''}</span></div>` +
        (t.message ? `<div class="msg">${esc(t.message)}</div>` : ''));
    } });
  // mode 'detail': summary without agent; 'tests': with the agent label.
  const runItem = (r, mode, label, openByDefault) => {
    const key = (mode === 'tests' ? 'trun:' : 'run:') + r.run;
    return { key, sig: JSON.stringify([r, label]),
      create: () => {
        const d = mk('details', 'run box'); d.dataset.key = key;
        d.open = state.open.has(key) || (!!openByDefault && !state.open.has('-' + key));
        d.append(mk('summary'), mk('div', 'tests'));
        d._cache = new Map();
        return d;
      },
      update: (el) => {
        const cls = !r.end ? 'RUN' : r.failed ? 'FAIL' : 'PASS';
        const sum = r.end ? esc(r.summary || `${r.passed} passed, ${r.failed} failed`) : `running (${r.tests.filter((t) => t.ok !== null).length}/${r.total ?? '?'})`;
        setHtml(el.firstChild, mode === 'tests'
          ? `${dateTime(r.ts)} &middot; <b class="${cls}">${esc(r.suite)}</b> &middot; ${esc(label)} &middot; ${esc(r.source || '')} &middot; ${r.end ? esc(r.summary) : 'running'}`
          : `<b class="${cls}">${esc(r.suite)}</b> <span class="m">${dateTime(r.ts)} &middot; ${esc(r.source || '')} &middot; ${sum}</span>`);
        reconcile(el.lastChild, r.tests.map(testItem), el._cache);
      } };
  };

  // ---- agent detail ----
  const curCache = new Map(), tlCache = new Map();
  async function loadDetail() {
    if (!state.sel) return;
    const id = state.sel;
    const d = await get(`/api/agents/${encodeURIComponent(id)}/events`);
    if (id === state.sel) { state.detail = d; renderDetail(); probeFrame(id); }
  }
  function renderDetail() {
    const a = state.agents.find((x) => x.id === state.sel);
    if (!a || !state.detail) return;
    if (state.detailFor !== a.id) {  // skeleton, once per selected agent
      state.detailFor = a.id; curCache.clear(); tlCache.clear();
      $('detail').innerHTML = `<div id="head"></div><div id="browser"></div><h3 id="curtitle"></h3><div id="cur"></div><h3>Timeline</h3><div id="timeline"></div><div id="tlempty" class="empty">Nothing yet.</div>`;
      $('detail').scrollTop = 0;
      updateBrowser();
    }
    const { events, runs } = state.detail;
    const cur = runs.length ? runs[runs.length - 1] : null;
    const pr = a.pr ? `<a href="${esc(a.pr)}" target="_blank" rel="noopener">PR</a>` : '';
    setHtml($('head'), `<h2><span class="dot ${esc(a.status)}"></span>${esc(a.title || a.id)}</h2>
      <div class="meta"><span>${esc(a.name || '')}</span><span class="pill">${esc(a.status)}</span>
      ${a.branch ? `<span>branch ${esc(a.branch)}</span>` : ''}${pr}${a.port ? `<span>port ${a.port}</span>` : ''}${a.checkout ? `<span>${esc(a.checkout)}</span>` : ''}</div>`);
    $('curtitle').textContent = cur && !cur.end ? 'Test run in progress' : 'Latest test run';
    reconcile($('cur'), cur ? [runItem(cur, 'detail', '', true)] : [], curCache);
    $('cur').classList.toggle('hidden', !cur);
    const items = events.filter((e) => e.kind === 'action' || e.kind === 'status').map((e) => ({ ts: e.ts, item: {
      key: `${e.ts}|${e.kind}|${e.text}`, sig: '1', create: () => mk('div', 'ev'),
      update: (el) => { el.innerHTML = `<time>${time(e.ts)}</time><span class="k">${e.kind}</span><span>${esc(e.text)}</span>`; } } }));
    runs.forEach((r) => items.push({ ts: r.ts, item: runItem(r, 'detail', '', false) }));
    items.sort((x, y) => y.ts - x.ts);
    reconcile($('timeline'), items.map((i) => i.item), tlCache);
    $('tlempty').classList.toggle('hidden', items.length > 0);
  }

  // Browser panel: the latest live frame of the agent (never stored server side). One persistent <img>: a new frame is
  // loaded off-screen and swapped in once decoded, so there is never a blank frame.
  const frames = {};  // agent id -> { ts: ms of the last frame message (or from the first load), v: cache-buster, shown, loading }
  function updateBrowser() {
    const box = $('browser'), id = state.sel, f = frames[id];
    if (!box || !f || state.detailFor !== id) return;
    if (!box.firstChild) {
      box.innerHTML = '<h3>Browser</h3><div class="badge"></div><div class="browser"><img id="frame" data-full="1" alt="agent browser"></div>';
    }
    const live = Date.now() - f.ts < 3000, badge = box.querySelector('.badge');
    badge.classList.toggle('live', live);
    const txt = live ? '● live' : 'last frame ' + time(f.ts / 1000);
    if (badge.textContent !== txt) badge.textContent = txt;
    const img = $('frame');
    if (img.dataset.v !== String(f.v) && !f.loading) {
      f.loading = true;
      const v = f.v, pre = new Image();
      const done = (ok) => {
        f.loading = false;
        const cur = $('frame');
        if (ok && cur && state.sel === id) { cur.src = pre.src; cur.dataset.v = String(v); }
        if (f.v !== v) updateBrowser();
      };
      pre.onload = () => done(true); pre.onerror = () => done(false);
      pre.src = `/api/agents/${encodeURIComponent(id)}/frame?v=${v}`;
    }
  }
  function onFrame(id, ts) {
    const f = frames[id] || (frames[id] = { ts: 0, v: 0 });
    f.ts = ts * 1000; f.v = ts;
    if (id === state.sel) updateBrowser();
    clearTimeout(onFrame.t); onFrame.t = setTimeout(updateBrowser, 3200);  // flips the badge to "last frame" once frames stop
  }
  async function probeFrame(id) {
    if (frames[id]) { updateBrowser(); return; }
    try { const r = await fetch(`/api/agents/${encodeURIComponent(id)}/frame`, { cache: 'no-store' }); if (r.ok) { frames[id] = { ts: Date.now() - 60000, v: Date.now() }; updateBrowser(); } } catch (e) { /* none */ }
  }
  const lightbox = (src) => {
    const d = document.createElement('div'); d.id = 'lightbox'; d.innerHTML = `<img src="${src}">`;
    d.onclick = () => d.remove(); document.body.appendChild(d);
  };
  document.addEventListener('click', (e) => {
    const im = e.target.closest('img.thumb, #frame');
    if (im) lightbox(im.dataset.full === '1' ? im.src : im.dataset.full);
  });
  // Larger preview of a test thumbnail while hovering it.
  const hover = $('hover');
  const placeHover = (e) => {
    const w = 480, h = hover.offsetHeight || 300;
    hover.style.left = Math.max(8, Math.min(e.clientX + 16, innerWidth - w - 8)) + 'px';
    hover.style.top = Math.max(8, Math.min(e.clientY + 16, innerHeight - h - 8)) + 'px';
  };
  document.addEventListener('mouseover', (e) => {
    const im = e.target.closest && e.target.closest('img.thumb');
    if (!im) return;
    hover.src = im.dataset.full; hover.classList.remove('hidden'); placeHover(e);
  });
  document.addEventListener('mousemove', (e) => { if (!hover.classList.contains('hidden')) placeHover(e); });
  document.addEventListener('mouseout', (e) => { if (e.target.closest && e.target.closest('img.thumb')) hover.classList.add('hidden'); });

  // ---- Tests tab: refreshed when a run starts or ends (or on opening / filtering), runs stay open ----
  const testsCache = new Map();
  async function renderTests() {
    const pq = state.project ? 'project=' + encodeURIComponent(state.project) : '';
    const runs = await get('/api/runs?' + [state.suite ? 'suite=' + encodeURIComponent(state.suite) : '', pq].filter(Boolean).join('&'));
    const all = state.suite ? await get('/api/runs' + (pq ? '?' + pq : '')) : runs;
    const suites = [...new Set(all.map((r) => r.suite))].sort();
    const label = (id) => { const a = state.agents.find((x) => x.id === id); return a ? (a.title || a.id) : id; };
    const sel = $('suite');
    const opts = '<option value="">All</option>' + suites.map((s) => `<option ${s === state.suite ? 'selected' : ''}>${esc(s)}</option>`).join('');
    if (sel._html !== opts) { sel.innerHTML = opts; sel._html = opts; }
    sel.value = state.suite;
    $('norun').classList.toggle('hidden', runs.length > 0);
    reconcile($('runlist'), runs.map((r) => runItem(r, 'tests', label(r.agent), false)), testsCache);
  }
  $('suite').onchange = (e) => { state.suite = e.target.value; renderTests(); };

  // Remember which <details> the user opened.
  document.addEventListener('toggle', (e) => {
    const d = e.target, k = d.dataset && d.dataset.key;
    if (!k) return;
    if (d.open) { state.open.add(k); state.open.delete('-' + k); } else { state.open.delete(k); state.open.add('-' + k); }
  }, true);
  $('agents').onclick = (e) => {
    const el = e.target.closest('.agent');
    if (!el) return;
    state.sel = el.dataset.id; state.detail = null; renderAgents(); loadDetail();
  };
  const setTab = (t) => {
    state.tab = t;
    $('tab-agents').classList.toggle('on', t === 'agents'); $('tab-tests').classList.toggle('on', t === 'tests');
    $('m-agents').classList.toggle('hidden', t !== 'agents'); $('m-tests').classList.toggle('hidden', t !== 'tests');
    if (t === 'tests') renderTests();
  };
  $('tab-agents').onclick = () => setTab('agents');
  $('tab-tests').onclick = () => setTab('tests');

  async function refresh() {
    state.agents = (await get('/api/state')).agents;
    if (!state.sel && state.agents.length) { state.sel = (state.agents.find((a) => a.status !== 'archived') || state.agents[0]).id; }
    renderAgents();
    await loadDetail();
  }
  let timer = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(() => refresh().catch(() => {}), 120); };
  function connect() {
    const es = new EventSource('/api/stream');
    es.onopen = () => { $('conn').textContent = 'live'; later(); if (state.tab === 'tests') renderTests(); };
    es.onmessage = (m) => {
      let d = {}; try { d = JSON.parse(m.data); } catch (e) { /* ignore */ }
      if (d.type === 'frame') { onFrame(d.agent, d.ts); return; }
      later();
      const k = d.event && d.event.kind;
      if (state.tab === 'tests' && (k === 'run-start' || k === 'run-end')) renderTests();
    };
    es.onerror = () => { $('conn').textContent = 'reconnecting...'; es.close(); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>
